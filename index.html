<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self'; img-src 'self' data:; connect-src https://frndcsvhzolwtuqvofmg.supabase.co; base-uri 'none'; form-action 'none'">
  <meta name="color-scheme" content="light dark">
  <title>報修登記</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <nav class="site-nav" aria-label="頁面切換">
      <a href="./" aria-current="page">報修登記</a>
      <a href="delivery.html">交期詢問</a>
    </nav>
    <h1>報修登記</h1>
    <p class="subtitle">填寫下方表單送出報修，管理員會依序處理。</p>
  </header>

  <main>
    <section class="card" aria-labelledby="form-title">
      <h2 id="form-title">新增報修</h2>

      <form id="repair-form" novalidate>
        <div class="field">
          <label for="reporter_name">報修人</label>
          <input id="reporter_name" name="reporter_name" type="text"
                 maxlength="50" autocomplete="name" required>
        </div>

        <div class="field">
          <label for="location">地點或部門</label>
          <input id="location" name="location" type="text" maxlength="100" required>
        </div>

        <div class="field">
          <label for="category">類別</label>
          <select id="category" name="category" required>
            <option value="" selected disabled>請選擇類別</option>
            <option value="設備">設備</option>
            <option value="網路">網路</option>
            <option value="環境">環境</option>
            <option value="其他">其他</option>
          </select>
        </div>

        <div class="field">
          <label for="description">問題說明</label>
          <textarea id="description" name="description" rows="4" maxlength="1000" required></textarea>
          <p class="hint"><span id="desc-count">0</span> / 1000 字</p>
        </div>

        <fieldset class="field">
          <legend>緊急程度</legend>
          <div class="segmented">
            <label><input type="radio" name="urgency" value="低"><span>低</span></label>
            <label><input type="radio" name="urgency" value="中" checked><span>中</span></label>
            <label><input type="radio" name="urgency" value="高"><span>高</span></label>
          </div>
        </fieldset>

        <button id="submit-btn" type="submit">送出報修</button>
        <p id="form-message" class="message" role="status" aria-live="polite" hidden></p>
      </form>
    </section>

    <section class="card" aria-labelledby="list-title">
      <div class="list-header">
        <h2 id="list-title">最近 20 筆報修</h2>
        <button id="refresh-btn" type="button" class="secondary">重新整理</button>
      </div>
      <p id="list-message" class="message" role="status" aria-live="polite" hidden></p>
      <ul id="repair-list" class="repair-list"></ul>
    </section>
  </main>

  <footer class="site-footer">示範用系統，請勿填寫真實姓名與敏感資料。</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"
          integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK"
          crossorigin="anonymous"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
